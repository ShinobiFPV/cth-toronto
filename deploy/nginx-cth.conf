# /etc/nginx/sites-available/cth  →  symlink into sites-enabled.
#
# A server block of its own, unlike shintech-forms which shares the main site's block.
# Capture the Hood is a whole app on its own hostname, not an /api/ path on shintech.online.
#
# Public entry is the Cloudflare Tunnel, which points at http://localhost:8094 directly.
# This vhost is what you use on the LAN (http://192.168.1.203) and as the TLS-free
# origin if you ever move the tunnel to front nginx instead of the app.

server {
    listen 80;
    server_name cth.shintech.online 192.168.1.203;

    # Drone stills run large. Cloudflare's free plan caps request bodies at 100 MB,
    # which is well above the app's own 60 MB limit, so this is the binding constraint.
    client_max_body_size 60M;

    # A 40 MB upload over a phone connection takes a while; do not time it out.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;

        # Chat and the live map run over a WebSocket at /ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are streamed straight through rather than spooled to the SD card.
        proxy_request_buffering off;
    }
}

# Put this in /etc/nginx/conf.d/upgrade-map.conf (http context, once per server):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
