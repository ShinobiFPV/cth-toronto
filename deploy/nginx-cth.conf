# /etc/nginx/sites-available/cth  →  symlink into sites-enabled.
#
# A server block of its own, unlike shintech-forms which shares the main site's block.
# ParkeMans GO! is a whole app on its own hostname, not an /api/ path on shintech.online.
#
# Public entry is the Cloudflare Tunnel, which points at http://localhost:8096 directly,
# so this vhost is what you use on the LAN (http://192.168.1.203) and as the TLS-free
# origin if you ever move the tunnel to front nginx instead of the app.
#
# Deliberately self-contained: no `map $http_upgrade $connection_upgrade` in the http
# context, because this box does not define one — shintech and shinracer each hardcode
# the upgrade header inside their own WebSocket locations. Adding a map would work, but
# needing a second file in conf.d to make one vhost valid is a trap for whoever installs
# this next. The WebSocket headers live on /ws, which is the only thing that upgrades.

server {
    listen 80;
    server_name cth.shintech.online 192.168.1.203;

    # Drone stills run large. Cloudflare's free plan caps request bodies at 100 MB,
    # which is above the app's own 60 MB limit, so this is the binding constraint.
    client_max_body_size 60M;

    # Chat and the live map. Long-lived, so it gets its own generous read timeout —
    # the default 60s would tear the socket down every minute.
    location /ws {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A 40 MB upload over a phone connection takes a while; do not time it out,
        # and stream it straight through rather than spooling it to the SD card.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
